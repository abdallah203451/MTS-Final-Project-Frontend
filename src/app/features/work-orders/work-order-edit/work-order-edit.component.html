<mat-card *ngIf="!loading; else l">
  <mat-card-header>
    <mat-card-title>Edit Work Order</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="form" (ngSubmit)="save()" class="form-grid">
      <!-- same form controls as create -->
      <mat-form-field appearance="outline">
        <mat-label>Title</mat-label>
        <input matInput formControlName="title" />
      </mat-form-field>
      <mat-form-field appearance="outline" class="fullwidth">
        <mat-label>Description</mat-label>
        <textarea matInput rows="4" formControlName="description"></textarea>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Customer Name</mat-label>
        <input matInput formControlName="customerName" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Customer Mobile</mat-label>
        <input matInput formControlName="customerMobile" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Customer Email</mat-label>
        <input matInput formControlName="customerEmail" />
      </mat-form-field>
      <mat-form-field appearance="outline" class="fullwidth">
        <mat-label>Customer Address</mat-label>
        <textarea
          matInput
          rows="2"
          formControlName="customerAddress"
        ></textarea>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Proposed Date</mat-label>
        <input matInput type="date" formControlName="proposedSchedulingDate" />
      </mat-form-field>

      <div class="actions">
        <button
          mat-flat-button
          color="primary"
          type="submit"
          [disabled]="saving || form.invalid"
        >
          Save
        </button>
        <button
          mat-button
          type="button"
          (click)="router.navigate(['/work-orders', id])"
        >
          Cancel
        </button>
      </div>
    </form>
  </mat-card-content>
</mat-card>

<ng-template #l>
  <div class="loading">Loading…</div>
</ng-template>

<style>
  .form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  .fullwidth {
    grid-column: 1 / -1;
  }
  .actions {
    grid-column: 1 / -1;
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 8px;
  }
  .loading {
    padding: 24px;
    text-align: center;
  }
</style>
