<mat-card>
  <mat-card-header>
    <mat-card-title>Work Orders</mat-card-title>
    <mat-card-subtitle>Search and manage work orders</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <div class="toolbar-row">
      <mat-form-field appearance="outline" class="search-field">
        <mat-label>Search</mat-label>
        <input
          matInput
          placeholder="title, customer name or mobile"
          [(ngModel)]="searchQ"
          (keyup.enter)="search()"
        />
        <button
          mat-icon-button
          matSuffix
          aria-label="clear"
          *ngIf="searchQ"
          (click)="clear()"
        >
          <mat-icon>close</mat-icon>
        </button>
      </mat-form-field>

      <span class="spacer"></span>

      <button mat-flat-button color="primary" (click)="create()">
        <mat-icon>add</mat-icon> New Work Order
      </button>
    </div>

    <div class="table-wrap" *ngIf="!loading; else loadingTpl">
      <table
        mat-table
        [dataSource]="workOrders"
        class="mat-elevation-z2 full-width"
      >
        <ng-container matColumnDef="workOrderId">
          <th mat-header-cell *matHeaderCellDef>ID</th>
          <td mat-cell *matCellDef="let row">{{ row.workOrderId }}</td>
        </ng-container>

        <ng-container matColumnDef="title">
          <th mat-header-cell *matHeaderCellDef>Title</th>
          <td mat-cell *matCellDef="let row">{{ row.title }}</td>
        </ng-container>

        <ng-container matColumnDef="customerName">
          <th mat-header-cell *matHeaderCellDef>Customer</th>
          <td mat-cell *matCellDef="let row">{{ row.customerName }}</td>
        </ng-container>

        <ng-container matColumnDef="proposedSchedulingDate">
          <th mat-header-cell *matHeaderCellDef>Date</th>
          <td mat-cell *matCellDef="let row">
            {{ row.proposedSchedulingDate | date }}
          </td>
        </ng-container>

        <ng-container matColumnDef="createdByName">
          <th mat-header-cell *matHeaderCellDef>Created By</th>
          <td mat-cell *matCellDef="let row">{{ row.createdByName }}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let row">
            <button
              mat-icon-button
              color="primary"
              (click)="view(row.workOrderId)"
              matTooltip="View"
            >
              <mat-icon>visibility</mat-icon>
            </button>
            <button
              mat-icon-button
              color="accent"
              (click)="edit(row.workOrderId)"
              matTooltip="Edit"
            >
              <mat-icon>edit</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </div>

    <ng-template #loadingTpl>
      <div class="loading"><mat-icon>hourglass_top</mat-icon> Loading...</div>
    </ng-template>
  </mat-card-content>
</mat-card>

<style>
  .toolbar-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }
  .search-field {
    width: 380px;
  }
  .spacer {
    flex: 1 1 auto;
  }
  .table-wrap {
    overflow: auto;
  }
  .full-width {
    width: 100%;
  }
  .loading {
    text-align: center;
    padding: 24px;
    color: rgba(0, 0, 0, 0.6);
  }
</style>
