<mat-card *ngIf="tech">
  <mat-card-header>
    <mat-card-title>{{ tech.name }}</mat-card-title>
    <mat-card-subtitle
      >{{ tech.email }} • {{ tech.phoneNumber }}</mat-card-subtitle
    >
  </mat-card-header>

  <mat-card-content>
    <h3>Availability (next days)</h3>
    <mat-list *ngIf="slots?.length; else none">
      <mat-list-item *ngFor="let d of slots">
        <div matLine>
          <strong>{{ d.date | date }}</strong>
        </div>
        <div matLine class="muted">
          <span *ngFor="let iv of d.intervals">
            <mat-icon inline *ngIf="iv.available">check_circle</mat-icon>
            <mat-icon inline *ngIf="!iv.available">block</mat-icon>
            {{ iv.label }}
            <span class="gap"></span>
          </span>
        </div>
      </mat-list-item>
    </mat-list>
    <ng-template #none>
      <p class="muted">No availability data</p>
    </ng-template>
  </mat-card-content>

  <mat-card-actions>
    <button mat-button (click)="navigateToTechnicians()">Back</button>
  </mat-card-actions>
</mat-card>

<style>
  .muted {
    color: rgba(0, 0, 0, 0.6);
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .gap {
    margin-right: 12px;
  }
</style>
